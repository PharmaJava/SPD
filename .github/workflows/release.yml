# Publicación de una versión: al subir una etiqueta v* (p. ej. `git tag v1.0.0 && git push origin v1.0.0`),
# o a mano desde la pestaña Actions (workflow_dispatch, con la etiqueta a publicar).
#
# Pasos (en Windows, porque el instalador NSIS se construye allí):
#  1. Instala Node 22 y las dependencias exactas (npm ci).
#  2. Pasa las pruebas y la comprobación de tipos: una versión que no pasa NO se publica.
#  3. `npm run dist:win` compila (principal + interfaz + recursos) y empaqueta con electron-builder:
#     instalador NSIS (SPD-<versión>-win-x64.exe) en release/ (ya no se publica versión portable).
#  4. Calcula el SHA-256 de cada artefacto y lo guarda en SHA256SUMS.txt.
#  5. Crea (o actualiza) la Release de GitHub con el instalador, el manual de usuario (PDF) y SHA256SUMS.txt.
#
# ⚠️ Ajustes del repositorio necesarios (docs/14-distribucion.md):
#  - Settings → Actions → General → Workflow permissions: «Read and write» (o dejar el `permissions` de abajo).
#  - ACTUALIZACIONES: el programa consulta SÓLO https://api.github.com/repos/PharmaJava/SPD/releases/latest y descarga
#    SPD-<versión>-win-x64.exe, comprobándolo contra SHA256SUMS.txt de la MISMA release. Por eso la Release tiene que
#    estar en PharmaJava/SPD y ser PÚBLICA; con DESCARGAS_REPO distinto los usuarios no recibirían avisos.
#    (No se usa electron-updater, así que no hace falta latest.yml.)
#  - Repo PRIVADO: las descargas de la Release sólo las ve quien tenga acceso al repositorio. Para que cualquier
#    farmacia descargue hay que usar un repo público de descargas: crear el secreto DESCARGAS_TOKEN (token con
#    permiso de contenidos sobre ese repo) y la variable DESCARGAS_REPO («usuario/SPD-descargas»). Si no existen,
#    la Release se crea en este mismo repositorio.
#  - SIN FIRMA DE CÓDIGO: Windows SmartScreen avisará de «aplicación no reconocida». Para firmar harían falta los
#    secretos CSC_LINK y CSC_KEY_PASSWORD (certificado) y quitar `signAndEditExecutable: false` en package.json.
name: Publicar versión
on:
  push:
    tags: ['v*']
    # Alternativa cuando no se pueden subir etiquetas: cambiar el contenido de este fichero en main
    # publica la versión de package.json (la etiqueta vX.Y.Z se crea al publicar la Release).
    branches: [main]
    paths: ['.github/publicar/version.txt']
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta a publicar (p. ej. v1.0.0)'
        required: true
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    env:
      ETIQUETA: ${{ github.event.inputs.etiqueta || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.etiqueta || github.ref }}
      - name: Etiqueta desde package.json (si se lanzó por cambio de fichero en main)
        if: github.ref_type == 'branch' && github.event.inputs.etiqueta == ''
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "ETIQUETA=v$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: La etiqueta tiene que coincidir con la versión de package.json
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:ETIQUETA) { throw "La etiqueta $($env:ETIQUETA) no coincide con package.json (v$v): el actualizador compara versiones y busca SPD-$v-win-x64.exe" }
      - run: node --test --test-reporter=dot "tests/**/*.test.ts"
      - run: npm run typecheck
      - name: Construir instalador
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # sin firma (ver nota de arriba)
      - name: Sumas SHA-256
        shell: pwsh
        run: |
          Set-Location release
          Copy-Item ..\docs\manual\manual-usuario.pdf .\Manual-de-usuario-SPD.pdf
          $ficheros = Get-ChildItem -File | Where-Object { $_.Extension -in '.exe', '.pdf' }
          if (-not ($ficheros | Where-Object { $_.Extension -eq '.exe' })) { throw 'No se generó ningún .exe en release/' }
          $lineas = foreach ($f in $ficheros) { $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($f.Name)" }
          $lineas | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Publicar la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ETIQUETA }}
          name: SPD ${{ env.ETIQUETA }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          repository: ${{ vars.DESCARGAS_REPO || github.repository }}
          token: ${{ secrets.DESCARGAS_TOKEN || secrets.GITHUB_TOKEN }}
          body: |
            Instalador de Windows (`SPD-*-win-x64.exe`) y manual de usuario en PDF. Comprueba el SHA-256 con `SHA256SUMS.txt`.
            Esta versión no está firmada: Windows SmartScreen puede avisar de «aplicación no reconocida».
            SPD NO es un producto sanitario; lee la licencia incluida.
          files: |
            release/*.exe
            release/Manual-de-usuario-SPD.pdf
            release/SHA256SUMS.txt
